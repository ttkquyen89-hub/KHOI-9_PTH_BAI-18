                        </div>
                    </div>

                    {/* Nhiệm vụ 3 */}
                    <div className="mb-8 p-6 border-2 border-amber-200 rounded-2xl bg-white shadow-sm print:border-none print:p-0 print:bg-transparent print:shadow-none">
                        <h3 className="font-bold text-2xl mb-6 text-amber-900 flex items-center gap-2">
                        <Pointer className="text-amber-500 print:hidden"/> 
                        Nhiệm vụ 3. Đọc SGK và chọn tên kim loại thích hợp điền vào chỗ trống.
                        </h3>
                        <ul className="space-y-5 text-xl">
                        <li className="flex flex-col sm:flex-row sm:items-center gap-3 bg-amber-50/50 p-3 rounded-lg border border-amber-100 print:border-none print:bg-transparent">
                            <span className="font-semibold flex-1">Kim loại dễ dát mỏng, dễ kéo sợi:</span>
                            <div className="sm:w-64"><SelectBlank name="nv3_datmong" options={OPTS.nv3_datmong} /></div>
                        </li>
                        <li className="flex flex-col sm:flex-row sm:items-center gap-3 bg-amber-50/50 p-3 rounded-lg border border-amber-100 print:border-none print:bg-transparent">
                            <span className="font-semibold flex-1">Kim loại dẫn điện tốt nhất:</span>
                            <div className="sm:w-64"><SelectBlank name="nv3_dandien" options={OPTS.nv3_dandien} /></div>
                        </li>
                        <li className="flex flex-col sm:flex-row sm:items-center gap-3 bg-amber-50/50 p-3 rounded-lg border border-amber-100 print:border-none print:bg-transparent">
                            <span className="font-semibold flex-1">Kim loại dẫn nhiệt tốt nhất:</span>
                            <div className="sm:w-64"><SelectBlank name="nv3_dannhiet" options={OPTS.nv3_dannhiet} /></div>
                        </li>
                        <li className="flex flex-col sm:flex-row sm:items-center gap-3 bg-amber-50/50 p-3 rounded-lg border border-amber-100 print:border-none print:bg-transparent">
                            <span className="font-semibold flex-1">Kim loại có nhiệt độ nóng chảy cao nhất:</span>
                            <div className="sm:w-64"><SelectBlank name="nv3_nongchay_cao" options={OPTS.nv3_nongchay_cao} /></div>
                        </li>
                        <li className="flex flex-col sm:flex-row sm:items-center gap-3 bg-amber-50/50 p-3 rounded-lg border border-amber-100 print:border-none print:bg-transparent">
                            <span className="font-semibold flex-1">Kim loại có nhiệt độ nóng chảy thấp nhất:</span>
                            <div className="sm:w-64"><SelectBlank name="nv3_nongchay_thap" options={OPTS.nv3_nongchay_thap} /></div>
                        </li>
                        </ul>
                    </div>

                    {/* Kết luận 1 */}
                    <div className="p-6 border-2 border-amber-400 rounded-2xl bg-amber-100 shadow-md print:border-none print:p-0 print:bg-transparent print:shadow-none">
                        <h3 className="font-bold text-2xl mb-4 text-amber-900 print:text-black">Kết luận 1. Nêu ba tính chất vật lí chung của kim loại.</h3>
                        <DropdownBlank name="kl1" options={OPTS.kl1} />
                    </div>
                    </section>

                    {/* ================= PHẦN II ================= */}
                    <section className="bg-emerald-50 p-6 rounded-3xl border-2 border-emerald-200 print:bg-transparent print:border-none print:p-0">
                    <h2 className="text-3xl font-extrabold bg-emerald-600 text-white p-4 rounded-2xl mb-8 shadow-md print:bg-transparent print:text-black print:p-0 print:shadow-none inline-block">
                        II. TÌM HIỂU TÍNH CHẤT HÓA HỌC CỦA KIM LOẠI
                    </h2>
                    
                    <h3 className="font-bold text-2xl mb-4 text-emerald-900 border-b-2 border-emerald-200 pb-2">1. Tác dụng với phi kim</h3>
                    <h4 className="font-bold text-xl mb-6 text-emerald-800 italic bg-emerald-100 inline-block px-4 py-2 rounded-lg">a) Tác dụng với oxygen</h4>
                    
                    {/* Nhiệm vụ 4 */}
                    <div className="mb-8 p-6 border-2 border-emerald-200 rounded-2xl bg-white shadow-sm print:border-none print:p-0 print:bg-transparent print:shadow-none">
                        <h3 className="font-bold text-2xl mb-6 text-emerald-900 flex items-center gap-2">
                        <Pointer className="text-emerald-500 print:hidden"/> 
                        Nhiệm vụ 4. Đọc tác dụng với oxygen và quan sát Hình 18.2.
                        </h3>
                        <div className="space-y-8">
                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 1. Khi đốt nóng dây sắt đưa vào bình chứa oxygen, sắt cháy tạo thành chất rắn màu nâu đen. Chất tạo thành là gì?</p>
                            <div className="mt-4 grid grid-cols-1 md:grid-cols-12 gap-4">
                            <div className="md:col-span-12 flex flex-col gap-2">
                                <span className="font-bold text-emerald-700 uppercase">Trả lời:</span>
                                <DropdownBlank name="nv4_q1_tl" options={OPTS.nv4_q1_tl} />
                            </div>
                            <div className="md:col-span-12 flex flex-col gap-2 mt-2">
                                <span className="font-bold text-emerald-700 uppercase">Phương trình hóa học:</span>
                                <DropdownBlank name="nv4_q1_pthh" options={OPTS.nv4_q1_pthh} />
                            </div>
                            </div>
                        </div>

                        <div className="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100">
                            <p className="font-bold text-xl text-gray-800 mb-4">Câu 2. Hoàn thành sơ đồ phản ứng sau:</p>
                            <div className="space-y-4 text-xl">
                            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                                <span className="font-semibold w-48 text-emerald-900">Sắt + oxygen <span className="font-bold text-2xl">→</span></span>
                                <div className="flex-1"><DropdownBlank name="nv4_q2_sat" options={OPTS.nv4_q2_sat} /></div>
                            </div>
                            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                                <span className="font-semibold w-48 text-emerald-900">Nhôm + oxygen <span className="font-bold text-2xl">→</span></span>
                                <div className="flex-1"><DropdownBlank name="nv4_q2_nhom" options={OPTS.nv4_q2_nhom} /></div>
                            </div>
                            </div>
                        </div>

                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 3. Chọn phương trình hóa học đúng:</p>
                            <div className="mt-4 space-y-6">
                            <div className="bg-gray-50 p-4 rounded-xl">
                                <span className="block mb-3 font-semibold text-lg">a) Sắt tác dụng với oxygen tạo iron(II,III) oxide (Fe₃O₄).</span>
                                <DropdownBlank name="nv4_q3_a" options={OPTS.nv4_q3_a} />
                            </div>
                            <div className="bg-gray-50 p-4 rounded-xl">
                                <span className="block mb-3 font-semibold text-lg">b) Nhôm tác dụng với oxygen tạo aluminium oxide (Al₂O₃).</span>
                                <DropdownBlank name="nv4_q3_b" options={OPTS.nv4_q3_b} />
                            </div>
                            </div>
                        </div>

                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 4. Quan sát SGK, cho biết tất cả kim loại có phản ứng với oxygen hay không? Nêu ví dụ.</p>
                            <DropdownBlank name="nv4_q4" options={OPTS.nv4_q4} />
                        </div>
                        </div>
                    </div>

                    {/* Nhiệm vụ 5 */}
                    <div className="mb-10 p-6 border-2 border-emerald-200 rounded-2xl bg-white shadow-sm print:border-none print:p-0 print:bg-transparent print:shadow-none">
                        <h3 className="font-bold text-2xl mb-6 text-emerald-900 flex items-center gap-2">
                        <Pointer className="text-emerald-500 print:hidden"/> 
                        Nhiệm vụ 5. Quan sát thông tin phản ứng của zinc và gold với oxygen.
                        </h3>
                        <div className="space-y-8">
                        <div>
                            <p className="font-bold text-xl text-gray-800 mb-3">Câu 1. Chọn phương trình phản ứng giữa zinc (Zn) và oxygen (O₂):</p>
                            <DropdownBlank name="nv5_q1" options={OPTS.nv5_q1} />
                        </div>
                        
                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 2. Vì sao đồ vật bằng zinc có thể bị biến đổi bề mặt, trong khi trang sức gold giữ được vẻ sáng bóng?</p>
                            <DropdownBlank name="nv5_q2" options={OPTS.nv5_q2} />
                        </div>
                        </div>
                    </div>

                    <h4 className="font-bold text-xl mb-6 text-teal-800 italic bg-teal-100 inline-block px-4 py-2 rounded-lg">b) Tác dụng với chlorine</h4>

                    {/* Nhiệm vụ 6 */}
                    <div className="p-6 border-2 border-teal-200 rounded-2xl bg-white shadow-sm print:border-none print:p-0 print:bg-transparent print:shadow-none">
                        <h3 className="font-bold text-2xl mb-6 text-teal-900 flex items-center gap-2">
                        <Pointer className="text-teal-500 print:hidden"/> 
                        Nhiệm vụ 6. Quan sát Hình 18.3 và Hình 18.4 trong SGK.
                        </h3>
                        <div className="space-y-8">
                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 1. Khi đốt nóng sodium (Na) đưa vào bình chứa chlorine (Cl₂), phản ứng tạo thành chất gì?</p>
                            <div className="mt-4 grid grid-cols-1 gap-4">
                            <div className="flex flex-col gap-2">
                                <span className="font-bold text-teal-700 uppercase">Trả lời:</span>
                                <DropdownBlank name="nv6_q1_tl" options={OPTS.nv6_q1_tl} />
                            </div>
                            <div className="flex flex-col gap-2 mt-2">
                                <span className="font-bold text-teal-700 uppercase">Phương trình hóa học:</span>
                                <DropdownBlank name="nv6_q1_pthh" options={OPTS.nv6_q1_pthh} />
                            </div>
                            </div>
                        </div>

                        <div>
                            <p className="font-bold text-xl text-gray-800 mb-3">Câu 2. Chọn PTHH đúng giữa sodium và chlorine:</p>
                            <DropdownBlank name="nv6_q2" options={OPTS.nv6_q2} />
                        </div>

                        <div>
                            <p className="font-bold text-xl text-gray-800 mb-3">Câu 3. Sắt phản ứng tạo thành iron(III) chloride (FeCl₃). Chọn PTHH đúng:</p>
                            <DropdownBlank name="nv6_q3" options={OPTS.nv6_q3} />
                        </div>

                        <div>
                            <p className="font-bold text-xl text-gray-800">Câu 4. Qua hai thí nghiệm trên, em nhận xét gì về khả năng phản ứng của kim loại với chlorine?</p>
                            <DropdownBlank name="nv6_q4" options={OPTS.nv6_q4} />
                        </div>
                        </div>
                    </div>
                    </section>

                    {/* CÁC NÚT TƯƠNG TÁC (ẨN KHI IN) */}
                    <div className="mt-12 flex justify-center gap-6 print:hidden border-t-4 border-gray-200 pt-10">
                    <button 
                        onClick={() => window.print()}
                        className="flex items-center gap-2 bg-gray-700 hover:bg-gray-800 text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-lg hover:shadow-xl text-xl hover:-translate-y-1"
                    >
                        <Printer size={28} />
                        In phiếu học tập
                    </button>
                    
                    <button 
                        onClick={() => setShowModal(true)}
                        className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-2xl transition-all shadow-lg hover:shadow-xl text-xl hover:-translate-y-1"
                    >
                        <Save size={28} />
                        Hoàn thành & Lưu
                    </button>
                    </div>

                </div>

                {/* MODAL THÔNG BÁO THÀNH CÔNG */}
                {showModal && (
                    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 print:hidden backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-10 max-w-md w-full shadow-2xl relative animate-in fade-in zoom-in duration-300">
                        <button 
                        onClick={() => setShowModal(false)}
                        className="absolute top-5 right-5 text-gray-400 hover:text-gray-800 transition-colors bg-gray-100 rounded-full p-2"
                        >
                        <X size={28} />
                        </button>
                        
                        <div className="flex flex-col items-center text-center">
                        <CheckCircle2 size={80} className="text-green-500 mb-6 drop-shadow-md" />
                        <h3 className="text-3xl font-extrabold text-gray-800 mb-4">Đã lưu thành công!</h3>
                        <p className="text-gray-600 text-lg mb-8 leading-relaxed">
                            Tuyệt vời <strong className="text-blue-700">{formData.hoTen ? formData.hoTen : 'bạn'}</strong>! Bạn đã hoàn thành Phiếu học tập. Hãy nhấn nút "In phiếu" để lưu dạng PDF hoặc nộp cho giáo viên nhé.
                        </p>
                        <button 
                            onClick={() => setShowModal(false)}
                            className="w-full bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl hover:bg-blue-700 transition-colors text-xl shadow-md"
                        >
                            Đồng ý
                        </button>
                        </div>
                    </div>
                    </div>
                )}
                
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhieuHocTap />);
    </script>
</body>
</html>
